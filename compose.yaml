name: observatorio

services:
  app:
    container_name: observatorio-app
    image: ghcr.io/leonardomb1/observatorio-tg-sst:${OBSERVATORIO_VERSION:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://observatorio:${POSTGRES_PASSWORD}@db:5432/observatorio
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: cf-connecting-ip
      BODY_SIZE_LIMIT: 50M
    ports:
      - 127.0.0.1:3007:3000
    networks:
      - default
      - proxy
    extra_hosts:
      - auth.greencrest.com.br:172.18.0.2
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_started

  worker:
    image: ghcr.io/leonardomb1/observatorio-tg-sst:${OBSERVATORIO_VERSION:-latest}
    build: .
    restart: unless-stopped
    command: ['node', 'build-worker/main.js']
    env_file: .env
    environment:
      DATABASE_URL: postgres://observatorio:${POSTGRES_PASSWORD}@db:5432/observatorio
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    shm_size: 1g
    environment:
      POSTGRES_DB: observatorio
      POSTGRES_USER: observatorio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U observatorio -d observatorio']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:

networks:
  proxy:
    external: true
